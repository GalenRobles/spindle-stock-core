services:
  postgres:
    image: postgres:16-alpine
    container_name: taller_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: almacen_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: taller_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
